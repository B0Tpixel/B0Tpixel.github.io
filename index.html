<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Classes</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f6f4ef;
    --board:#1b2a22;
    --board-ink:#f6f4ef;
    --ink:#1b2a22;
    --ink-soft:#5c6b62;
    --accent:#c98a2c;
    --accent-soft:#f1e2c2;
    --border:#dcd6c8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#11170f;
      --board:#182019;
      --board-ink:#eef1ea;
      --ink:#eef1ea;
      --ink-soft:#8a988f;
      --accent:#e0a83c;
      --accent-soft:#2e2410;
      --border:#28322a;
    }
  }
  :root[data-theme="dark"]{
    --paper:#11170f;
    --board:#182019;
    --board-ink:#eef1ea;
    --ink:#eef1ea;
    --ink-soft:#8a988f;
    --accent:#e0a83c;
    --accent-soft:#2e2410;
    --border:#28322a;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:8px;
  }

  .board{
    max-width:420px;
    margin:0 auto;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--paper);
  }

  .board-head{
    background:var(--board);
    color:var(--board-ink);
    padding:12px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .board-head .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .board-head .today-date{
    font-family:"Archivo",-apple-system,sans-serif;
    font-size:14px;
    font-weight:700;
    text-wrap:balance;
    text-align:right;
  }

  .rows{padding:2px 0;}

  .row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
  }
  .row:last-child{border-bottom:none;}

  .time{
    flex:0 0 auto;
    width:56px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:13px;
    line-height:1.35;
    color:var(--accent);
    padding-top:1px;
  }
  .time .end{color:var(--ink-soft);font-weight:500;}

  .meta{flex:1;min-width:0;}
  .meta .line1{
    display:flex;
    align-items:baseline;
    gap:7px;
    font-family:"Archivo",-apple-system,sans-serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.3;
  }
  .meta .code{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--accent);
    background:var(--accent-soft);
    border-radius:4px;
    padding:1.5px 5px;
    flex:0 0 auto;
  }
  .meta .loc{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
    line-height:1.35;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .empty{
    padding:26px 16px 22px;
    text-align:center;
  }
  .empty .headline{
    font-family:"Archivo",-apple-system,sans-serif;
    font-weight:700;
    font-size:14.5px;
    margin-bottom:4px;
  }
  .empty .sub{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: no-preference){
    .row{animation:fade-in .25s ease-out backwards;}
    .row:nth-child(1){animation-delay:.02s;}
    .row:nth-child(2){animation-delay:.06s;}
    .row:nth-child(3){animation-delay:.1s;}
    .row:nth-child(4){animation-delay:.14s;}
    .row:nth-child(5){animation-delay:.18s;}
    @keyframes fade-in{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>

<div class="board">
  <div class="board-head">
    <span class="eyebrow">Today's Classes</span>
    <span class="today-date" id="dateLabel"></span>
  </div>
  <div id="rows" class="rows"></div>
</div>

<script>
(function(){
  var CLASSES = [
    {code:'MEDS3003',activity:'Lecture',day:'Wed',time:'09:00',duration:'2 hrs',location:'Merewether Lecture Theatre (1) 131'},
    {code:'MEDS3003',activity:'Practical',day:'Mon',time:'13:00',duration:'3 hrs',location:'CPC XLab PC1 2501-VR'},
    {code:'MEDS3888',activity:'Drop-In',day:'Tue',time:'09:00',duration:'1 hr',location:'CPC Seminar Room 1.2'},
    {code:'MEDS3888',activity:'Lecture',day:'Thu',time:'09:00',duration:'1 hr',location:'Wallace Lecture Theatre 200'},
    {code:'MEDS3888',activity:'Lecture',day:'Mon',time:'12:00',duration:'1 hr',location:'Eastern Avenue Auditorium'},
    {code:'MEDS3888',activity:'Project',day:'Thu',time:'14:00',duration:'2 hrs',location:'Carslaw Lecture Theatre 175'},
    {code:'MEDS3888',activity:'Workshop',day:'Thu',time:'16:00',duration:'2 hrs',location:'Wallace Lecture Theatre 200'},
    {code:'NEUR3006',activity:'Lecture',day:'Mon',time:'13:00',duration:'1 hr',location:'Carslaw Lecture Theatre 273'},
    {code:'NEUR3006',activity:'Lecture',day:'Tue',time:'12:00',duration:'1 hr',location:'Law Annex Lecture Theatre 101'},
    {code:'NEUR3006',activity:'Tutorial',day:'Wed',time:'14:00',duration:'1.5 hrs',location:'CPC Seminar Room 2.1 and 2.2-VR'},
    {code:'PCOL3022',activity:'Lecture',day:'Tue',time:'14:00',duration:'1 hr',location:'CPC Auditorium'},
    {code:'PCOL3022',activity:'Lecture',day:'Wed',time:'13:00',duration:'1 hr',location:'Carslaw Lecture Theatre 159-259'},
    {code:'PCOL3022',activity:'Practical',day:'Wed',time:'11:00',duration:'2 hrs',location:'CPC Seminar Room 1.1 and 1.3-VR'}
  ];
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function endTime(time, duration){
    var parts = time.split(':');
    var startMin = parseInt(parts[0],10) * 60 + parseInt(parts[1],10);
    var durMatch = duration.match(/([\d.]+)/);
    var durMin = durMatch ? Math.round(parseFloat(durMatch[1]) * 60) : 0;
    var endMin = startMin + durMin;
    var h = Math.floor(endMin / 60) % 24;
    var m = endMin % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  try{
    var now = new Date();
    var todayName = DAY_NAMES[now.getDay()];
    var dateLabel = now.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
    document.getElementById('dateLabel').textContent = dateLabel;

    var todays = CLASSES.filter(function(c){ return c.day === todayName; });
    todays.sort(function(a,b){ return a.time.localeCompare(b.time); });

    var rowsEl = document.getElementById('rows');

    if(todays.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<div class="headline">Nothing on the board</div><div class="sub">No classes today</div>';
      rowsEl.appendChild(empty);
    } else {
      todays.forEach(function(c){
        var row = document.createElement('div');
        row.className = 'row';

        var time = document.createElement('div');
        time.className = 'time';
        time.innerHTML = c.time + '<br><span class="end">' + endTime(c.time, c.duration) + '</span>';

        var meta = document.createElement('div');
        meta.className = 'meta';

        var line1 = document.createElement('div');
        line1.className = 'line1';
        var code = document.createElement('span');
        code.className = 'code';
        code.textContent = c.code;
        line1.appendChild(code);
        line1.appendChild(document.createTextNode(c.activity));

        var loc = document.createElement('div');
        loc.className = 'loc';
        loc.textContent = c.location;

        meta.appendChild(line1);
        meta.appendChild(loc);
        row.appendChild(time);
        row.appendChild(meta);
        rowsEl.appendChild(row);
      });
    }
  }catch(e){
    document.getElementById('rows').innerHTML = '<div class="empty"><div class="headline">Could not load</div><div class="sub">Refresh to try again</div></div>';
  }
})();
</script>

</body>
</html>
